name: Android APK

# A debug APK of Surface AI for every push, ready to download and sideload.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The tests run straight from TypeScript, but app modules under test import Capacitor
      # plugins (e.g. settings.ts -> @capacitor/preferences), which resolve from app/node_modules.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  apk:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3

      # --ignore-scripts skips onnxruntime-node's postinstall, which downloads native binaries the app never uses.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: surface-ai-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
